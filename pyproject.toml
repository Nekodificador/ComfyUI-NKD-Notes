[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "comfyui-nkd-notes"
version = "1.1.0"
description = "Annotate your workflows: Markdown hints that point arrows at nodes and widgets, numbered guided tours, free arrows, highlight zones and a guide node that lists and exports everything."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/Nekodificador/ComfyUI-NKD-Notes"

[tool.comfy]
PublisherId = "nekodificador"
DisplayName = "NKD Notes"
